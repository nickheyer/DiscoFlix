<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" font-family="'gg sans','Noto Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7289da"/><stop offset="1" stop-color="#4752c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7289da" stop-opacity="0.5"/><stop offset="1" stop-color="#7289da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff78c8" stop-opacity="0.55"/><stop offset="1" stop-color="#ff78c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78dcff" stop-opacity="0.55"/><stop offset="1" stop-color="#78dcff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7289da" stop-opacity="0"/><stop offset="1" stop-color="#7289da" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <style>
    .beam1 { animation: swayL 9s ease-in-out infinite; transform-origin: 700px 118px; }
    .beam2 { animation: swayR 9s ease-in-out infinite; transform-origin: 700px 118px; }
    .spark { animation: tw 3.4s ease-in-out infinite; }
    .s2 { animation-delay: 0.7s; } .s3 { animation-delay: 1.3s; } .s4 { animation-delay: 2.1s; }
    .s5 { animation-delay: 1.7s; } .s6 { animation-delay: 2.7s; }
    .ballGlow { animation: pulse 6s ease-in-out infinite; }
    @keyframes swayL { 0%,100% { transform: rotate(-4deg);} 50% { transform: rotate(7deg);} }
    @keyframes swayR { 0%,100% { transform: rotate(4deg);} 50% { transform: rotate(-7deg);} }
    @keyframes tw { 0%,100% { opacity: 0.12; } 45% { opacity: 0.95; } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <rect width="1400" height="420" rx="18" fill="#202225"/>
  <rect y="220" width="1400" height="200" fill="url(#floor)" rx="18"/>

  <!-- beams -->
  <g class="beam1"><polygon points="700,118 240,420 560,420" fill="url(#beamL)"/></g>
  <g class="beam2"><polygon points="700,118 840,420 1160,420" fill="url(#beamR)"/></g>

  <!-- sparkles -->
  <g fill="#e6ebff">
    <circle class="spark"    cx="356" cy="96"  r="2.6"/>
    <circle class="spark s2" cx="516" cy="182" r="2.1"/>
    <circle class="spark s3" cx="884" cy="170" r="2.4"/>
    <circle class="spark s4" cx="1052" cy="88" r="2.8"/>
    <circle class="spark s5" cx="252" cy="220" r="1.9"/>
    <circle class="spark s6" cx="1180" cy="228" r="2.2"/>
  </g>

  <!-- app icon, hung like the glitter ball -->
  <circle class="ballGlow" cx="700" cy="118" r="128" fill="url(#glow)"/>
  <line x1="700" y1="0" x2="700" y2="50" stroke="#8a93c8" stroke-width="3"/>
  <rect x="634" y="52" width="132" height="132" rx="42" fill="url(#appBg)"/>
  <image href="data:image/png;base64," x="655" y="73" width="90" height="90"/>

  <!-- wordmark -->
  <text x="700" y="288" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="2">
    <tspan fill="#ffffff">Disco</tspan><tspan fill="#7289da">Flix</tspan>
  </text>
  <text x="700" y="330" text-anchor="middle" fill="#b9bbbe" font-size="21" letter-spacing="5">THE DISCORD CONCIERGE FOR YOUR MEDIA SERVER</text>

  <!-- service pills -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="404" y="356" width="84" height="30" rx="15" fill="#2f3136"/><text x="446" y="376" fill="#ffc230">Radarr</text>
    <rect x="496" y="356" width="84" height="30" rx="15" fill="#2f3136"/><text x="538" y="376" fill="#35c5f4">Sonarr</text>
    <rect x="588" y="356" width="70" height="30" rx="15" fill="#2f3136"/><text x="623" y="376" fill="#e5a00d">Plex</text>
    <rect x="666" y="356" width="96" height="30" rx="15" fill="#2f3136"/><text x="714" y="376" fill="#ffb347">SABnzbd</text>
    <rect x="770" y="356" width="100" height="30" rx="15" fill="#2f3136"/><text x="820" y="376" fill="#d97757">Anthropic</text>
    <rect x="878" y="356" width="86" height="30" rx="15" fill="#2f3136"/><text x="921" y="376" fill="#dcddde">OpenAI</text>
    <rect x="972" y="356" width="24" height="30" rx="15" fill="none"/>
    <text x="984" y="376" fill="#72767d">+</text>
  </g>
</svg>
