version: "3"

dotenv: [.env]

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  CREDENTIALS: -X github.com/nickheyer/DiscoFlix/internal/credentials.TMDB={{.TMDB_API_KEY}} -X github.com/nickheyer/DiscoFlix/internal/credentials.TVDB={{.TVDB_API_KEY}} -X github.com/nickheyer/DiscoFlix/internal/credentials.Trakt={{.TRAKT_CLIENT_ID}} -X github.com/nickheyer/DiscoFlix/internal/credentials.Fanart={{.FATV_PROJECT_API_KEY}}
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} {{.CREDENTIALS}}

tasks:
  default:
    cmds:
      - task: build

  gen:
    desc: Regenerate protos, Ent code, and JSON schemas
    cmds:
      - go tool buf generate
      - go tool ent generate --feature sql/upsert,sql/execquery,sql/modifier,sql/lock ./internal/store/ent/schema

  migrate:diff:
    desc: Write a new migration from the Ent schema, NAME=...
    cmds:
      - go run ./internal/store/migratediff -name {{.NAME}}
    requires:
      vars: [NAME]

  web:install:
    dir: web
    cmds:
      - bun install --frozen-lockfile
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/.bin/vite

  web:build:
    dir: web
    deps: [web:install]
    cmds:
      - bun run build
    sources:
      - src/**/*
      - static/**/*
      - package.json
      - svelte.config.js
      - vite.config.ts
    generates:
      - build/200.html

  web:dev:
    dir: web
    deps: [web:install]
    cmds:
      - bun run dev

  build:
    desc: Build the binary for this platform, linking the provider keys from .env
    deps: [web:build]
    cmds:
      - CGO_ENABLED=0 go build -tags purego,gtk3,production -ldflags "{{.LDFLAGS}}" -o bin/discoflix ./cmd/discoflix

  run:
    deps: [build]
    cmds:
      - ./bin/discoflix serve --data-dir ./data --log-level debug

  crosswalk:build:
    desc: Build the Wikidata crosswalk snapshot into bin/crosswalk.sqlite
    cmds:
      - go run ./snapshot/cmd/crosswalk build --out bin/crosswalk.sqlite

  crosswalk:publish:
    desc: Sign a built crosswalk into a mirror layout, ONLINE_KEY=path/to/online.key
    cmds:
      - go run ./snapshot/cmd/crosswalk publish --repo bin/crosswalk-repo --root snapshot/root.json --online-key {{.ONLINE_KEY}} --sqlite bin/crosswalk.sqlite
    requires:
      vars: [ONLINE_KEY]

  test:
    deps: [web:build]
    cmds:
      - go test -tags purego,gtk3,production ./...
      - cd web && bun run test

  lint:
    cmds:
      - go vet -tags purego,gtk3,production ./...
      - go tool buf lint
      - golangci-lint run
      - cd web && bun run check

  cross:
    desc: Cross-compile all six release targets without packaging
    deps: [web:build]
    cmds:
      - for: [linux/amd64, linux/arm64, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64]
        cmd: CGO_ENABLED=0 GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} go build -tags purego,gtk3,production -ldflags "{{.LDFLAGS}}" -o bin/cross/{{.ITEM}}/discoflix{{if eq (splitList "/" .ITEM | first) "windows"}}.exe{{end}} ./cmd/discoflix

  release:snapshot:
    deps: [web:build]
    cmds:
      - go tool goreleaser release --snapshot --clean
