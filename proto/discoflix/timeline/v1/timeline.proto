edition = "2023";

package discoflix.timeline.v1;

import "buf/validate/validate.proto";
import "discoflix/capability/v1/options.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;

enum SpaceKind {
  SPACE_KIND_UNSPECIFIED = 0;
  SPACE_KIND_SYSTEM = 1;
  SPACE_KIND_GUILD = 2;
  SPACE_KIND_LIBRARY = 3;
  SPACE_KIND_PLUGIN = 4;
  SPACE_KIND_PROVIDER = 5;
  SPACE_KIND_SERVER = 6;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_TEXT = 1;
  CHANNEL_KIND_CATEGORY = 2;
  CHANNEL_KIND_VOICE = 3;
  CHANNEL_KIND_THREAD = 4;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_USER = 1;
  MESSAGE_KIND_SYSTEM = 2;
  MESSAGE_KIND_CARD = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_MESSAGE_CREATED = 1;
  EVENT_KIND_MESSAGE_EDITED = 2;
  EVENT_KIND_MESSAGE_DELETED = 3;
  EVENT_KIND_CARD_UPDATED = 4;
  EVENT_KIND_CHANNEL_READ = 5;
}

message Space {
  string id = 1;
  SpaceKind kind = 2;
  string name = 3;
  string icon_url = 4;
  string external_id = 5;
  int32 position = 6;
  google.protobuf.Timestamp created_at = 7;
  int64 unread = 8;
}

message Channel {
  string id = 1;
  string space_id = 2;
  ChannelKind kind = 3;
  string name = 4;
  string topic = 5;
  string parent_id = 6;
  int32 position = 7;
  string external_id = 8;
  int64 last_seq = 9;
  int64 last_read_seq = 10;
  int64 unread = 11;
}

message Author {
  string id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string accent_color = 4;
  // person, bot, plugin, agent
  string kind = 5;
}

message Message {
  int64 seq = 1;
  string space_id = 2;
  string channel_id = 3;
  Author author = 4;
  MessageKind kind = 5;
  string content = 6;
  google.protobuf.Any card = 7;
  int64 reply_to = 8;
  string external_id = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp edited_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
}

message Event {
  int64 seq = 1;
  EventKind kind = 2;
  Message message = 3;
  string channel_id = 4;
  string space_id = 5;
  google.protobuf.Timestamp at = 6;
}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message ListChannelsRequest {
  string space_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message ListMessagesRequest {
  string channel_id = 1 [(buf.validate.field).string.min_len = 1];
  // Return messages with seq strictly below this value, 0 means newest
  int64 before_seq = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 0, lte: 200}];
}

message ListMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
}

message PostMessageRequest {
  string channel_id = 1 [(buf.validate.field).string.min_len = 1];
  string content = 2 [(buf.validate.field).string.max_len = 4000];
  google.protobuf.Any card = 3;
  int64 reply_to = 4;
}

message PostMessageResponse {
  Message message = 1;
}

message EditMessageRequest {
  int64 seq = 1 [(buf.validate.field).int64.gt = 0];
  string content = 2 [(buf.validate.field).string.max_len = 4000];
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  int64 seq = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteMessageResponse {}

message MarkReadRequest {
  string channel_id = 1 [(buf.validate.field).string.min_len = 1];
  int64 seq = 2;
}

message MarkReadResponse {
  Channel channel = 1;
}

message WatchEventsRequest {
  // Resume after this seq, 0 means from now
  int64 after_seq = 1;
  // Restrict to one space, empty means every space the caller can read
  string space_id = 2;
}

message WatchEventsResponse {
  Event event = 1;
}

service TimelineService {
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "timeline.read"
      effect: EFFECT_READ
      title: "List spaces"
      description: "Spaces the caller is a member of"
    };
  }
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "reader"
      effect: EFFECT_READ
      object: {type: "space", field: "space_id"}
      title: "List channels"
      description: "Channels of one space with unread counts for the caller"
    };
  }
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "reader"
      effect: EFFECT_READ
      object: {type: "channel", field: "channel_id"}
      title: "List messages"
      description: "A page of messages from one channel, newest first"
    };
  }
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "writer"
      effect: EFFECT_WRITE
      object: {type: "channel", field: "channel_id"}
      slash: true
      title: "Post message"
      description: "Post a message or a card to one channel"
    };
  }
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "writer"
      effect: EFFECT_WRITE
      object: {type: "message", field: "seq"}
      title: "Edit message"
      description: "Edit the content of a message the caller authored"
    };
  }
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "writer"
      effect: EFFECT_DESTRUCTIVE
      object: {type: "message", field: "seq"}
      title: "Delete message"
      description: "Delete a message the caller authored or moderates"
    };
  }
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "reader"
      effect: EFFECT_WRITE
      object: {type: "channel", field: "channel_id"}
      title: "Mark read"
      description: "Advance the caller's read cursor on one channel"
    };
  }
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse) {
    option (discoflix.capability.v1.capability) = {
      scope: "timeline.read"
      effect: EFFECT_READ
      title: "Watch events"
      description: "Stream timeline events the caller can read, resumable by seq"
    };
  }
}
